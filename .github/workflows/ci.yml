name: CI

# Lint, typecheck, the citation tests and a production build on every PR and push to main.
#
# No secrets and no env block. The build and every check here run with no API key, which
# was verified on a clean clone with an empty environment before this file was written.
# `npm run eval` is deliberately absent: it calls Anthropic and Voyage, needs a deployed
# URL, and costs money per run. Deploys stay manual (`vercel deploy --prod`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Citation tests
        run: npx tsx scripts/test-citations.ts
      - name: Build
        run: npx next build
